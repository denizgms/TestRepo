<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111318" />
  <title>Imposter Word Game</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app">
    <h1>Imposter</h1>
    <section id="joinScreen" class="card">
      <h2>Beitreten oder Lobby erstellen</h2>
      <input id="nameInput" placeholder="Dein Name" maxlength="20" />
      <input id="codeInput" placeholder="Lobby-Code" maxlength="5" />
      <div class="actions">
        <button id="createBtn" class="primary">Lobby erstellen</button>
        <button id="joinBtn" class="secondary">Spiel beitreten</button>
      </div>
    </section>

    <section id="gameScreen" class="hidden card">
      <p><strong>Lobby:</strong> <span id="lobbyCode"></span></p>
      <p><strong>Link:</strong> <a id="lobbyUrl" href=""></a></p>
      <p id="phaseLabel"></p>
      <p id="statusMessage"></p>
      <div id="categoryBlock" class="category-box">
        <label for="categorySelect">Wortliste</label>
        <select id="categorySelect"></select>
        <p id="categoryInfo"></p>
      </div>
      <div id="privateInfo" class="private-box"></div>
      <div>
        <h3>Spieler</h3>
        <ul id="playersList"></ul>
      </div>
      <div id="controls" class="actions"></div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>
</html>
